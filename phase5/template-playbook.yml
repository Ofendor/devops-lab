---
- name: Deploy nginx config from template
  hosts: local
  become: yes
  vars_files:
    - vars.yml
  tasks:
    - name: Copy nginx config template
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/default
        owner: root
        group: root
        mode: 0644
      notify: restart nginx

    - name: Remove default symlink if it points elsewhere
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      ignore_errors: yes

    - name: Enable our site
      file:
        src: /etc/nginx/sites-available/default
        dest: /etc/nginx/sites-enabled/default
        state: link
      notify: restart nginx

  handlers:
    - name: restart nginx
      service:
        name: nginx
        state: restarted
