---
- name: Deploy nginx on Kubernetes
  hosts: local
  vars:
    ansible_python_interpreter: /usr/bin/python3
  environment:
    KUBECONFIG: /home/[directory name]/.kube/config
  tasks:
    - name: Create nginx deployment
      kubernetes.core.k8s:
        state: present
        kubeconfig: /home/[directory name]/.kube/config
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nginx-ansible
            namespace: default
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: nginx-ansible
            template:
              metadata:
                labels:
                  app: nginx-ansible
              spec:
                containers:
                  - name: nginx
                    image: nginx:alpine
                    ports:
                      - containerPort: 80

    - name: Create NodePort Service
      kubernetes.core.k8s:
        state: present
        kubeconfig: /home/[directory name]/.kube/config
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: nginx-ansible-svc
            namespace: default
          spec:
            type: NodePort
            selector:
              app: nginx-ansible
            ports:
              - port: 80
                targetPort: 80
